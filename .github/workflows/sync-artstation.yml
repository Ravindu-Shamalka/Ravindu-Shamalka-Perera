name: Sync ArtStation portfolio
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update project gallery
        run: python scripts/sync_artstation.py
      - name: Commit new projects
        run: |
          if git diff --quiet -- projects.js; then
            echo 'No new projects'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects.js
          git commit -m 'Sync new ArtStation projects'
          git push
